apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gen3-commons1
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
  - repoURL: https://github.com/uc-cdis/gen3-helm
    path: helm/gen3
    targetRevision: master
    helm:
      releaseName: commons1
      valueFiles:
      - $values/values/values.yaml
      - $values/values/fence.yaml
  - repoURL: https://github.com/alan-walsh/argo-test
    targetRevision: HEAD
    ref: values
  destination:
    server: "https://kubernetes.default.svc"
    namespace: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true